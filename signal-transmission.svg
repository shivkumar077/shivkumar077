<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="105" viewBox="0 0 1000 105" role="img" aria-labelledby="title desc">
  <title id="title">Developer signal — channel 077</title>
  <desc id="desc">A refined neon identity strip with a compact animated equalizer and concise engineering motto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#090d18"/><stop offset=".5" stop-color="#11152a"/><stop offset="1" stop-color="#08171b"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42f5e9"/><stop offset="1" stop-color="#ff4ecd"/></linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="998" height="103" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="105" rx="12" fill="url(#bg)"/>
    <rect x="1" y="1" width="998" height="103" rx="12" fill="none" stroke="#42f5e9" stroke-opacity=".48"/>
    <rect x="18" y="17" width="4" height="70" rx="2" fill="url(#neon)"/>
    <text x="36" y="25" fill="#42f5e9" font-family="monospace" font-size="9" letter-spacing="2.5">CHANNEL 077 / PERSONAL TRANSMISSION</text>
    <g transform="translate(38 43)" fill="url(#neon)">
      <rect x="0" y="11" width="5" height="18" rx="2"><animate attributeName="height" values="8;24;8" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="16;8;16" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="9" y="4" width="5" height="32" rx="2"><animate attributeName="height" values="25;10;25" dur=".9s" repeatCount="indefinite"/><animate attributeName="y" values="8;22;8" dur=".9s" repeatCount="indefinite"/></rect>
      <rect x="18" y="0" width="5" height="40" rx="2"><animate attributeName="height" values="14;37;14" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="13;2;13" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="27" y="8" width="5" height="24" rx="2"><animate attributeName="height" values="22;8;22" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="7;21;7" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="36" y="13" width="5" height="14" rx="2"><animate attributeName="height" values="7;20;7" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="16;9;16" dur="1.2s" repeatCount="indefinite"/></rect>
    </g>
    <text x="110" y="58" fill="#f3f6ff" font-family="monospace" font-size="19" font-weight="700" letter-spacing=".4">BUILD THINGS THAT MAKE PEOPLE</text>
    <text x="110" y="81" fill="#42f5e9" font-family="monospace" font-size="19" font-weight="700" letter-spacing=".4">STOP SCROLLING.</text>
    <path d="M675 19V86" stroke="#2a3b52"/>
    <text x="698" y="38" fill="#ff4ecd" font-family="monospace" font-size="9" letter-spacing="1.5">CURRENT DIRECTIVE</text>
    <text x="698" y="56" fill="#a7b8d4" font-family="monospace" font-size="11">Learn deeply.</text>
    <text x="698" y="71" fill="#a7b8d4" font-family="monospace" font-size="11">Ship boldly.</text>
    <text x="698" y="86" fill="#42f5e9" font-family="monospace" font-size="11">Stay curious_</text>
    <circle cx="972" cy="22" r="3" fill="#42f5e9"><animate attributeName="opacity" values="1;.2;1" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>