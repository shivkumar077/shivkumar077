<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Shiv Kumar — animated developer telemetry</title>
  <desc id="desc">A fictional cyberpunk command dashboard showing engineering focus, project signals, and a pulsing system core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/><stop offset=".55" stop-color="#101126"/><stop offset="1" stop-color="#07151b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42f5e9"/><stop offset="1" stop-color="#39a8ff"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff4ecd"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#42f5e9" stop-opacity=".4"/><stop offset="1" stop-color="#42f5e9" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#6d82a8" stroke-opacity=".12" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="1" y="1" width="998" height="358" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="360" rx="16" fill="url(#bg)"/>
    <rect width="1000" height="360" fill="url(#grid)"/>
    <circle cx="520" cy="170" r="180" fill="url(#core)"/>
    <path d="M0 304 L1000 84" stroke="#42f5e9" stroke-opacity=".07" stroke-width="1"/>
    <path d="M0 326 L1000 106" stroke="#ff4ecd" stroke-opacity=".06" stroke-width="1"/>
    <rect x="1" y="1" width="998" height="358" rx="16" fill="none" stroke="#42f5e9" stroke-opacity=".6"/>
    <path d="M1 46H999" stroke="#42f5e9" stroke-opacity=".28"/>
    <circle cx="24" cy="24" r="5" fill="#ff5f57"/><circle cx="42" cy="24" r="5" fill="#febc2e"/><circle cx="60" cy="24" r="5" fill="#28c840"/>
    <text x="82" y="29" fill="#7e91ad" font-family="monospace" font-size="11" letter-spacing="2">SHADOW//DEV_CONSOLE</text>
    <text x="973" y="29" fill="#42f5e9" text-anchor="end" font-family="monospace" font-size="11">BUILD 2026.10</text>
    <text x="28" y="76" fill="#42f5e9" font-family="monospace" font-size="10" letter-spacing="3">LIVE TELEMETRY / PERSONAL OPERATING SYSTEM</text>
    <text x="28" y="110" fill="#f4f7ff" font-family="monospace" font-size="25" font-weight="700" letter-spacing="1">ENGINEERING IN PROGRESS</text>
    <text x="28" y="132" fill="#8da0bd" font-family="monospace" font-size="12">Build things. Break assumptions. Ship better systems.</text>
    <g transform="translate(28 158)">
      <rect width="260" height="74" rx="8" fill="#0a111f" stroke="#253b53"/>
      <text x="14" y="20" fill="#7e91ad" font-family="monospace" font-size="10" letter-spacing="1.5">01 / BACKEND</text>
      <text x="14" y="42" fill="#f4f7ff" font-family="monospace" font-size="15">APIs + architecture</text>
      <rect x="14" y="54" width="230" height="4" rx="2" fill="#1e2a3e"/>
      <rect x="14" y="54" width="178" height="4" rx="2" fill="url(#cyan)"><animate attributeName="width" values="145;205;178;145" dur="5s" repeatCount="indefinite"/></rect>
    </g>
    <g transform="translate(28 245)">
      <rect width="260" height="74" rx="8" fill="#0a111f" stroke="#253b53"/>
      <text x="14" y="20" fill="#7e91ad" font-family="monospace" font-size="10" letter-spacing="1.5">02 / CLOUD + SYSTEMS</text>
      <text x="14" y="42" fill="#f4f7ff" font-family="monospace" font-size="15">Reliable by design</text>
      <rect x="14" y="54" width="230" height="4" rx="2" fill="#1e2a3e"/>
      <rect x="14" y="54" width="142" height="4" rx="2" fill="url(#pink)"><animate attributeName="width" values="105;174;142;105" dur="6s" repeatCount="indefinite"/></rect>
    </g>
    <g transform="translate(330 87)">
      <circle cx="155" cy="112" r="100" fill="none" stroke="#42f5e9" stroke-opacity=".12" stroke-dasharray="3 8"/>
      <circle cx="155" cy="112" r="78" fill="none" stroke="#42f5e9" stroke-opacity=".45" stroke-dasharray="2 7"/>
      <circle cx="155" cy="112" r="54" fill="none" stroke="#ff4ecd" stroke-opacity=".45" stroke-dasharray="32 8 3 8">
        <animateTransform attributeName="transform" type="rotate" from="0 155 112" to="360 155 112" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle cx="155" cy="112" r="37" fill="#0d1b2b" stroke="#42f5e9" stroke-width="1.5" filter="url(#glow)"/>
      <circle cx="155" cy="112" r="27" fill="url(#core)"/>
      <path d="M155 81 L166 106 L155 100 L144 106 Z M155 143 L144 118 L155 124 L166 118 Z" fill="#42f5e9" opacity=".9"/>
      <circle cx="155" cy="112" r="7" fill="#f4f7ff"><animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="155" cy="34" r="4" fill="#42f5e9" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M0 0 A78 78 0 1 1 0 0"/></circle>
      <circle cx="232" cy="112" r="4" fill="#ff4ecd" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="155" y="222" fill="#f4f7ff" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="2">CORE ONLINE</text>
      <text x="155" y="240" fill="#42f5e9" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="1">CURIOSITY / 100%</text>
    </g>
    <g transform="translate(670 91)">
      <text x="0" y="0" fill="#42f5e9" font-family="monospace" font-size="10" letter-spacing="2">ACTIVE MODULES</text>
      <g font-family="monospace" font-size="12">
        <rect x="0" y="18" width="296" height="39" rx="6" fill="#0a111f" stroke="#253b53"/>
        <circle cx="16" cy="37" r="4" fill="#42f5e9"><animate attributeName="opacity" values="1;.25;1" dur="1.5s" repeatCount="indefinite"/></circle>
        <text x="30" y="41" fill="#e8efff">SHADOW EXCHANGE</text><text x="280" y="41" fill="#42f5e9" text-anchor="end" font-size="9">DEPLOYED ↗</text>
        <rect x="0" y="66" width="296" height="39" rx="6" fill="#0a111f" stroke="#253b53"/>
        <circle cx="16" cy="85" r="4" fill="#ff4ecd"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
        <text x="30" y="89" fill="#e8efff">ASTRA</text><text x="280" y="89" fill="#ff4ecd" text-anchor="end" font-size="9">IN ORBIT</text>
        <rect x="0" y="114" width="296" height="39" rx="6" fill="#0a111f" stroke="#253b53"/>
        <circle cx="16" cy="133" r="4" fill="#a78bfa"><animate attributeName="opacity" values="1;.3;1" dur="1.7s" repeatCount="indefinite"/></circle>
        <text x="30" y="137" fill="#e8efff">ECHO WORLD SIM</text><text x="280" y="137" fill="#a78bfa" text-anchor="end" font-size="9">EXPERIMENTAL</text>
      </g>
      <text x="0" y="197" fill="#7e91ad" font-family="monospace" font-size="10" letter-spacing="1.5">SIGNAL STRENGTH</text>
      <g transform="translate(0 210)" fill="#42f5e9">
        <rect x="0" y="20" width="9" height="9" rx="1"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect x="14" y="14" width="9" height="15" rx="1"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".1s" repeatCount="indefinite"/></rect>
        <rect x="28" y="8" width="9" height="21" rx="1"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".2s" repeatCount="indefinite"/></rect>
        <rect x="42" y="1" width="9" height="28" rx="1"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".3s" repeatCount="indefinite"/></rect>
        <rect x="56" y="5" width="9" height="24" rx="1"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".4s" repeatCount="indefinite"/></rect>
        <rect x="70" y="12" width="9" height="17" rx="1"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".5s" repeatCount="indefinite"/></rect>
        <rect x="84" y="3" width="9" height="26" rx="1"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".6s" repeatCount="indefinite"/></rect>
        <rect x="98" y="17" width="9" height="12" rx="1"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".7s" repeatCount="indefinite"/></rect>
        <rect x="112" y="9" width="9" height="20" rx="1"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".8s" repeatCount="indefinite"/></rect>
        <rect x="126" y="0" width="9" height="29" rx="1"><animate attributeName="opacity" values=".25;1;.25" dur="1.2s" begin=".9s" repeatCount="indefinite"/></rect>
      </g>
      <text x="296" y="240" fill="#7e91ad" text-anchor="end" font-family="monospace" font-size="9">NO STATIC BUILDS. EVER.</text>
    </g>
    <path d="M28 337H972" stroke="#42f5e9" stroke-opacity=".22"/>
    <text x="28" y="350" fill="#526784" font-family="monospace" font-size="9">STATUS: LEARNING NEVER SHIPS TO PROD — ONLY CURIOSITY DOES</text>
    <text x="972" y="350" fill="#42f5e9" text-anchor="end" font-family="monospace" font-size="9">[ KEEP BUILDING ]</text>
  </g>
</svg>