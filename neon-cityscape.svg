<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
  <title id="title">Neon after-hours — Shiv Kumar</title>
  <desc id="desc">A cinematic animated cyberpunk city at night, with glowing skyscrapers, drifting light trails, stars, and a magenta-cyan moon.</desc>
