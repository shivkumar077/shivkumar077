<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
  <title id="title">Neon horizon — Shiv Kumar</title>
  <desc id="desc">A minimal cinematic synthwave horizon with a luminous striped sun, mountain silhouettes, and flowing neon light trails.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#080b18"/><stop offset=".58" stop-color="#19122e"/><stop offset="1" stop-color="#071b27"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4ecd"/><stop offset=".55" stop-color="#b58cff"/><stop offset="1" stop-color="#42f5e9"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42f5e9" stop-opacity="0"/><stop offset=".45" stop-color="#42f5e9"/><stop offset=".7" stop-color="#ff4ecd"/><stop offset="1" stop-color="#ff4ecd" stop-opacity="0"/></linearGradient>
    <radialGradient id="sunGlow"><stop stop-color="#ff4ecd" stop-opacity=".24"/><stop offset="1" stop-color="#ff4ecd" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="1" y="1" width="998" height="308" rx="15"/></clipPath>
    <clipPath id="sunClip"><circle cx="760" cy="100" r="64"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="310" rx="15" fill="url(#sky)"/>
    <circle cx="760" cy="100" r="115" fill="url(#sunGlow)"/>
    <g fill="#d9eaff">
      <circle cx="83" cy="54" r="1.4"/><circle cx="148" cy="89" r="1"/><circle cx="232" cy="43" r="1.2"/><circle cx="343" cy="76" r="1"/><circle cx="448" cy="49" r="1.4"/><circle cx="568" cy="80" r="1"/><circle cx="649" cy="42" r="1.4"/><circle cx="927" cy="64" r="1.2"/>
    </g>
    <circle cx="760" cy="100" r="64" fill="url(#sun)" filter="url(#glow)"/>
    <g clip-path="url(#sunClip)" stroke="#111126" stroke-width="6">
      <path d="M690 83H830 M690 100H830 M690 117H830 M690 134H830 M690 151H830"/>
    </g>
    <path d="M0 201 L98 153 L171 193 L260 126 L354 190 L445 144 L534 195 L641 154 L735 194 L829 143 L916 189 L1000 151 V260 H0Z" fill="#11172b"/>
    <path d="M0 220 L112 177 L202 216 L315 167 L412 219 L532 180 L628 222 L751 174 L856 216 L944 183 L1000 203 V263 H0Z" fill="#0a2230" stroke="#254b60" stroke-opacity=".7"/>
    <path d="M0 238 Q180 216 355 238 T700 238 T1000 231" fill="none" stroke="#42f5e9" stroke-width="2" stroke-opacity=".9" filter="url(#glow)"/>
    <path d="M0 250 Q180 228 355 250 T700 250 T1000 243" fill="none" stroke="#ff4ecd" stroke-width="1.5" stroke-opacity=".85"/>
    <path d="M0 260 Q180 241 355 260 T700 260 T1000 253" fill="none" stroke="#42f5e9" stroke-opacity=".28"/>
    <path d="M-100 246H1100" stroke="url(#trail)" stroke-width="3" stroke-dasharray="100 240"><animate attributeName="stroke-dashoffset" values="0;-680" dur="7s" repeatCount="indefinite"/></path>
    <rect x="0" y="270" width="1000" height="40" fill="#070b14" opacity=".95"/>
    <path d="M0 270H1000" stroke="#42f5e9" stroke-opacity=".45"/>
    <text x="28" y="288" fill="#42f5e9" font-family="monospace" font-size="9" letter-spacing="3">SHIV KUMAR / DIGITAL AFTERGLOW</text>
    <text x="28" y="303" fill="#f4f7ff" font-family="monospace" font-size="16" font-weight="700" letter-spacing=".8">MAKE THE FUTURE FEEL REAL.</text>
    <text x="972" y="290" text-anchor="end" fill="#ff4ecd" font-family="monospace" font-size="9">BACKEND × CLOUD × AI</text>
    <text x="972" y="303" text-anchor="end" fill="#71839f" font-family="monospace" font-size="8">PERSONAL SITE // BUILDING</text>
    <rect x="1" y="1" width="998" height="308" rx="15" fill="none" stroke="#42f5e9" stroke-opacity=".5"/>
  </g>
</svg>