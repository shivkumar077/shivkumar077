name: Generate cyberpunk profile visuals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-visuals.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit generated visuals only when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "Contribution visuals are unchanged."
          else
            git commit -m "chore: refresh contribution snake visuals"
            git pull --rebase origin main
            git push
          fi
