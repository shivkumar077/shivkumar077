name: Generate ASCII profile card

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-card.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Count code lines across public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cloc
          mkdir -p /tmp/owned-repos
          total=0
          while IFS= read -r repo_url; do
            [ -n "$repo_url" ] || continue
            repo_name="$(basename "$repo_url" .git)"
            target="/tmp/owned-repos/$repo_name"
            if git clone --quiet --depth 1 "$repo_url" "$target"; then
              cloc --quiet --json --exclude-dir=node_modules,dist,build,target,.git,.venv,venv,vendor,coverage --exclude-lang=Markdown,Text "$target" > "/tmp/owned-repos/$repo_name-cloc.json" || true
              count="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("SUM",{}).get("code",0))' "/tmp/owned-repos/$repo_name-cloc.json" 2>/dev/null || echo 0)"
              total=$((total + count))
              echo "$repo_name: $count code lines"
            fi
          done < <(gh api "users/shivkumar077/repos?per_page=100&type=owner" --paginate --jq '.[] | select(.visibility == "public" and .fork == false) | .clone_url')
          echo "TOTAL_CODE_LINES=$total" >> "$GITHUB_ENV"
          echo "Total code lines across public, non-fork repositories: $total"

      - name: Fetch live GitHub contribution stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_year="$(date -u +%Y)"
          created_year="$(gh api users/shivkumar077 --jq '.created_at' | cut -c1-4)"
          total_commits=0
          for year in $(seq "$created_year" "$current_year"); do
            if [ "$year" -eq "$current_year" ]; then
              year_end="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            else
              year_end="${year}-12-31T23:59:59Z"
            fi
            query="query { user(login: \"shivkumar077\") { contributionsCollection(from: \"${year}-01-01T00:00:00Z\", to: \"${year_end}\") { totalCommitContributions } } }"
            count="$(gh api graphql -f query="$query" --jq '.data.user.contributionsCollection.totalCommitContributions')"
            total_commits=$((total_commits + count))
          done
          contribution_query='query { user(login: "shivkumar077") { contributionsCollection { contributionCalendar { totalContributions } } } }'
          total_contributions="$(gh api graphql -f query="$contribution_query" --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')"
          echo "TOTAL_COMMITS=$total_commits" >> "$GITHUB_ENV"
          echo "TOTAL_CONTRIBUTIONS=$total_contributions" >> "$GITHUB_ENV"
          echo "GitHub-attributed commits (all years): $total_commits"
          echo "Contributions in the last 12 months: $total_contributions"

      - name: Download dark and light SVG cards
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://gh-ascii.vercel.app/shivkumar077?theme=dark" -o dark_mode.svg
          curl -fL --retry 3 "https://gh-ascii.vercel.app/shivkumar077?theme=light" -o light_mode.svg
          grep -q "<svg" dark_mode.svg
          grep -q "<svg" light_mode.svg

      - name: Add language, contact, and code-line details
        env:
          TOTAL_CODE_LINES: ${{ env.TOTAL_CODE_LINES }}
          TOTAL_COMMITS: ${{ env.TOTAL_COMMITS }}
          TOTAL_CONTRIBUTIONS: ${{ env.TOTAL_CONTRIBUTIONS }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path

          total = f"{int(os.environ['TOTAL_CODE_LINES']):,}"
          configs = {
              "dark_mode.svg": ("#ffa657", "#484f58", "#c9d1d9", "#79c0ff"),
              "light_mode.svg": ("#953800", "#8c959f", "#24292f", "#0550ae"),
          }
          for filename, (label, muted, value, metric_color) in configs.items():
              path = Path(filename)
              svg = path.read_text()
              svg = svg.replace('width="1043" height="536" viewBox="0 0 1043 536"', 'width="1043" height="636" viewBox="0 0 1043 636"')
              svg = svg.replace('width="1042" height="535"', 'width="1042" height="635"')

              # Assign explicit row positions so added rows can never collide.
              def place_row(match):
                  row = match.group(0)
                  placements = [
                      ("Contact", 253),
                      (". GitHub:", 273),
                      ("GitHub Stats", 393),
                      (". Repos:", 413),
                      (". Forks:", 433),
                      (". Commits:", 453),
                      (". PRs:", 473),
                      (". Top repo:", 493),
                      ("Last 12 Months", 553),
                      (". Contributions:", 573),
                      ("▃", 593),
                  ]
                  for marker, y in placements:
                      if marker in row:
                          return re.sub(r' y="[0-9.]+"', f' y="{y}"', row, count=1)
                  return row

              svg = re.sub(r'<text x="458[.]4" y="[0-9.]+"[^>]*>.*?</text>', place_row, svg)

              lang = re.search(r'<text x="458[.]4" y="153"[^>]*>.*?</text>', svg)
              if not lang:
                  raise SystemExit(f"Language row not found in {filename}")
              language_rows = f'''  <text x="458.4" y="153" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="{label}">. Languages.programming: </tspan><tspan fill="{value}">Python, Java, JavaScript, TypeScript</tspan></text>
            <text x="458.4" y="173" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="{label}">. Languages.computer: </tspan><tspan fill="{value}">HTML, CSS, SQL, JSON, XML, YAML, LaTeX</tspan></text>
            <text x="458.4" y="193" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="{label}">. Languages.me: </tspan><tspan fill="{value}">English, Hindi</tspan></text>'''
              svg = svg[:lang.start()] + language_rows + svg[lang.end():]

              github_row = re.search(r'<text x="458[.]4" y="273"[^>]*>.*?</text>', svg)
              if not github_row:
                  raise SystemExit(f"GitHub contact row not found in {filename}")
              contact_rows = f'''  <text x="458.4" y="293" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="{label}">. Email: </tspan><tspan fill="{muted}">........................</tspan><tspan fill="{value}"> shivkumar6990655@gmail.com</tspan></text>
            <text x="458.4" y="313" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="{label}">. LinkedIn: </tspan><tspan fill="{muted}">..............</tspan><tspan fill="{value}"> linkedin.com/in/shiv-kumar-399a32231</tspan></text>
            <text x="458.4" y="333" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="{label}">. Instagram: </tspan><tspan fill="{muted}">............</tspan><tspan fill="{value}"> instagram.com/nightcore_077</tspan></text>
            <text x="458.4" y="353" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="{label}">. X: </tspan><tspan fill="{muted}">.....................</tspan><tspan fill="{value}"> x.com/nightcore_077</tspan></text>'''
              svg = svg[:github_row.end()] + "\n" + contact_rows + svg[github_row.end():]

              metric = f"""  <text x="458.4" y="513" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="{label}">. Code lines: </tspan><tspan fill="{muted}">............</tspan><tspan fill="{metric_color}"> {total}</tspan></text>"""
              top_repo = re.search(r'<text x="458[.]4" y="493"[^>]*>.*?</text>', svg)
              if not top_repo:
                  raise SystemExit(f"Top repo row not found in {filename}")
              svg = svg[:top_repo.end()] + "\n" + metric + svg[top_repo.end():]
              commits = f"{int(os.environ['TOTAL_COMMITS']):,}"
              contributions = f"{int(os.environ['TOTAL_CONTRIBUTIONS']):,}"

              commit_row = re.search(r'<text x="458[.]4" y="453"[^>]*>.*?\. Commits:.*?</text>', svg)
              if not commit_row:
                  raise SystemExit(f"Commit stats row not found in {filename}")
              updated_commit_row = re.sub(
                  r'(<tspan fill="[^"]+">)\s*\d+(</tspan><tspan fill="[^"]+"> \| </tspan><tspan fill="[^"]+">\. Contributed:)',
                  lambda m: m.group(1) + " " + commits + m.group(2),
                  commit_row.group(0),
                  count=1
              )
              svg = svg[:commit_row.start()] + updated_commit_row + svg[commit_row.end():]

              contribution_row = re.search(r'<text x="458[.]4" y="573"[^>]*>.*?\. Contributions:.*?</text>', svg)
              if not contribution_row:
                  raise SystemExit(f"Contribution stats row not found in {filename}")
              updated_contribution_row = re.sub(
                  r'(<tspan fill="[^"]+">)\s*\d+(</tspan><tspan fill="[^"]+"> \| </tspan><tspan fill="[^"]+">\. Reviews:)',
                  lambda m: m.group(1) + " " + contributions + m.group(2),
                  contribution_row.group(0),
                  count=1
              )
              svg = svg[:contribution_row.start()] + updated_contribution_row + svg[contribution_row.end():]

              path.write_text(svg)
          PY

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=shivkumar077&theme=github-dark&hide_border=true&disable_animations=true&timezone=Asia/Kolkata
          path: streak.svg

      - name: Commit generated cards if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg streak.svg
          if git diff --cached --quiet; then
            echo "Cards are unchanged."
          else
            git commit -m "feat: show total GitHub code lines in profile cards"
            git push
          fi
