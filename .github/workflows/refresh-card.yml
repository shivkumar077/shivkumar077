name: Generate ASCII profile card

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-card.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Count code lines across public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y cloc
          mkdir -p /tmp/owned-repos
          total=0
          while IFS= read -r repo_url; do
            [ -n "$repo_url" ] || continue
            repo_name="$(basename "$repo_url" .git)"
            target="/tmp/owned-repos/$repo_name"
            if git clone --quiet --depth 1 "$repo_url" "$target"; then
              cloc --quiet --json --exclude-dir=node_modules,dist,build,target,.git,.venv,venv,vendor,coverage --exclude-lang=Markdown,Text "$target" > "/tmp/owned-repos/$repo_name-cloc.json" || true
              count="$(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("SUM",{}).get("code",0))' "/tmp/owned-repos/$repo_name-cloc.json" 2>/dev/null || echo 0)"
              total=$((total + count))
              echo "$repo_name: $count code lines"
            fi
          done < <(gh api "users/shivkumar077/repos?per_page=100&type=owner" --paginate --jq '.[] | select(.visibility == "public" and .fork == false) | .clone_url')
          echo "TOTAL_CODE_LINES=$total" >> "$GITHUB_ENV"
          echo "Total code lines across public, non-fork repositories: $total"

      - name: Download dark and light SVG cards
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://gh-ascii.vercel.app/shivkumar077?theme=dark" -o dark_mode.svg
          curl -fL --retry 3 "https://gh-ascii.vercel.app/shivkumar077?theme=light" -o light_mode.svg
          grep -q "<svg" dark_mode.svg
          grep -q "<svg" light_mode.svg

      - name: Add custom contact rows and total code lines
        env:
          TOTAL_CODE_LINES: ${{ env.TOTAL_CODE_LINES }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          total = f"{int(os.environ['TOTAL_CODE_LINES']):,}"
          rows = {
              "dark_mode.svg": """  <text x="458.4" y="233" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="#ffa657">. Email: </tspan><tspan fill="#484f58">........................</tspan><tspan fill="#c9d1d9"> shivkumar6990655@gmail.com</tspan></text>
            <text x="458.4" y="253" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="#ffa657">. LinkedIn: </tspan><tspan fill="#484f58">..............</tspan><tspan fill="#c9d1d9"> linkedin.com/in/shiv-kumar-399a32231</tspan></text>
            <text x="458.4" y="273" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="#ffa657">. Instagram: </tspan><tspan fill="#484f58">............</tspan><tspan fill="#c9d1d9"> instagram.com/nightcore_077</tspan></text>
            <text x="458.4" y="293" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="#ffa657">. X: </tspan><tspan fill="#484f58">.....................</tspan><tspan fill="#c9d1d9"> x.com/nightcore_077</tspan></text>""",
              "light_mode.svg": """  <text x="458.4" y="233" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="#953800">. Email: </tspan><tspan fill="#8c959f">........................</tspan><tspan fill="#24292f"> shivkumar6990655@gmail.com</tspan></text>
            <text x="458.4" y="253" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="#953800">. LinkedIn: </tspan><tspan fill="#8c959f">..............</tspan><tspan fill="#24292f"> linkedin.com/in/shiv-kumar-399a32231</tspan></text>
            <text x="458.4" y="273" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="#953800">. Instagram: </tspan><tspan fill="#8c959f">............</tspan><tspan fill="#24292f"> instagram.com/nightcore_077</tspan></text>
            <text x="458.4" y="293" font-family="'Consolas', 'Menlo', 'DejaVu Sans Mono', monospace" xml:space="preserve" font-size="16"><tspan fill="#953800">. X: </tspan><tspan fill="#8c959f">.....................</tspan><tspan fill="#24292f"> x.com/nightcore_077</tspan></text>"""
          }

          for filename, contact_rows in rows.items():
              path = Path(filename)
              svg = path.read_text()
              svg = svg.replace('width="1043" height="536" viewBox="0 0 1043 536"', 'width="1043" height="576" viewBox="0 0 1043 576"')
              svg = svg.replace('width="1042" height="535"', 'width="1042" height="575"')
              svg = re.sub(
                  r'(<text x="458\.4" y=")([0-9.]+)(" font-family=)',
                  lambda m: m.group(1) + str(float(m.group(2)) + 100 if float(m.group(2)) >= 253 else float(m.group(2))).rstrip("0").rstrip(".") + m.group(3),
                  svg
              )
              contact_row = re.search(r'<text x="458\.4" y="213"[^>]*>.*?</text>', svg)
              if not contact_row:
                  raise SystemExit(f"Contact row not found in {filename}")
              svg = svg[:contact_row.end()] + "\n" + contact_rows + svg[contact_row.end():]

              # Add a code-line metric below the top repository row.
              color = "#79c0ff" if filename == "dark_mode.svg" else "#0550ae"
              label = "#ffa657" if filename == "dark_mode.svg" else "#953800"
              muted = "#484f58" if filename == "dark_mode.svg" else "#8c959f"
              metric = f'  <text x="458.4" y="473" font-family="\'Consolas\', \'Menlo\', \'DejaVu Sans Mono\', monospace" xml:space="preserve" font-size="16"><tspan fill="{label}">. Code lines: </tspan><tspan fill="{muted}">............</tspan><tspan fill="{color}"> {total}</tspan></text>'
              top_repo = re.search(r'<text x="458\.4" y="453"[^>]*>.*?</text>', svg)
              if not top_repo:
                  raise SystemExit(f"Top repo row not found in {filename}")
              svg = svg[:top_repo.end()] + "\n" + metric + svg[top_repo.end():]
              path.write_text(svg)
          PY

      - name: Commit generated cards if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Cards are unchanged."
          else
            git commit -m "feat: show total GitHub code lines in profile cards"
            git push
          fi
